<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luís Correia</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;

            background:
                radial-gradient(circle at 15% 10%, rgba(255,255,255,.55), transparent 30%),
                linear-gradient(135deg, #e9dfcc, #ded1b9);

            color: #1c1a17;
            font-family: "Montserrat", sans-serif;

            overflow-x: hidden;
        }

        /* textura subtil */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(rgba(50,40,25,.07) 0.6px, transparent 0.6px);

            background-size: 5px 5px;

            pointer-events: none;
            opacity: .25;
        }

        .container {
            width: 100%;
            max-width: 620px;

            padding: 65px 22px 35px;

            text-align: center;
        }

        /* =========================
           MONOGRAMA / FOTO
        ========================= */

        .portrait {
            width: 125px;
            height: 125px;

            margin: auto;

            border-radius: 50%;

            background: #f8f4eb;

            border: 1px solid rgba(52,43,31,.25);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 12px 35px rgba(65,50,30,.18),
                inset 0 0 0 5px rgba(255,255,255,.35);

            position: relative;

            animation: entrance .8s ease;
        }

        .portrait::before {
            content: "";

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            border: 1px solid rgba(60,48,32,.20);
        }

        /*
           Quando tiveres a tua fotografia/logo,
           podes substituir o conteúdo deste elemento.
        */

        .initials {
            font-family: "Cormorant Garamond", serif;

            font-size: 48px;
            font-weight: 600;

            letter-spacing: 2px;

            color: #29241d;
        }

        @keyframes entrance {
            from {
                opacity: 0;
                transform: scale(.88);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================
           NOME
        ========================= */

        h1 {
            margin-top: 23px;

            font-family: "Cormorant Garamond", serif;

            font-size: 43px;
            line-height: 1;

            font-weight: 600;

            letter-spacing: 1px;

            color: #171512;
        }

        .subtitle {
            margin-top: 11px;

            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            font-style: italic;

            letter-spacing: .5px;

            color: #655b4d;
        }

        /* =========================
           LINHA DECORATIVA
        ========================= */

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            margin: 22px auto 18px;

            color: #756b5b;
        }

        .ornament::before,
        .ornament::after {
            content: "";

            width: 70px;
            height: 1px;

            background: rgba(75,62,43,.35);
        }

        .ornament span {
            font-family: "Cormorant Garamond", serif;

            font-size: 16px;
        }

        /* =========================
           BIO
        ========================= */

        .description {
            max-width: 480px;

            margin: auto;

            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            line-height: 1.55;

            color: #4d463c;
        }

        /* =========================
           LINKS
        ========================= */

        .links {
            margin-top: 34px;

            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .link {
            position: relative;

            min-height: 64px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: #25211b;

            background: rgba(249,246,238,.68);

            border: 1px solid rgba(73,59,39,.17);

            border-radius: 4px;

            font-family: "Montserrat", sans-serif;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            box-shadow:
                0 6px 18px rgba(60,45,28,.08);

            transition:
                transform .3s ease,
                background .3s ease,
                box-shadow .3s ease;

            opacity: 0;

            transform: translateY(18px);

            animation: appear .6s forwards;
        }

        .link:nth-child(1) {
            animation-delay: .15s;
        }

        .link:nth-child(2) {
            animation-delay: .25s;
        }

        .link:nth-child(3) {
            animation-delay: .35s;
        }

        .link:nth-child(4) {
            animation-delay: .45s;
        }

        @keyframes appear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link:hover {
            transform: translateY(-3px);

            background: rgba(255,253,248,.95);

            box-shadow:
                0 12px 28px rgba(60,45,28,.14);
        }

        .link:active {
            transform: scale(.98);
        }

        /* =========================
           ÍCONES
        ========================= */

        .icon {
            position: absolute;

            left: 19px;

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-right: 1px solid rgba(70,55,35,.18);

            padding-right: 19px;

            color: #423a2e;

            font-size: 16px;

            transition: .3s ease;
        }

        .link:hover .icon {
            color: #171512;

            transform: translateX(2px);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 38px;

            font-family: "Cormorant Garamond", serif;

            font-size: 15px;

            letter-spacing: .5px;

            color: #756b5d;
        }

        footer strong {
            color: #342d23;

            font-size: 17px;

            font-weight: 600;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 48px 17px 30px;
            }

            .portrait {
                width: 108px;
                height: 108px;
            }

            .initials {
                font-size: 40px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 17px;
            }

            .description {
                font-size: 17px;
            }

            .link {
                min-height: 61px;
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <!-- =========================
             MONOGRAMA
        ========================== -->

        <div class="portrait">
            <span class="initials">LC</span>
        </div>


        <!-- =========================
             NOME
        ========================== -->

        <h1>Luís Correia</h1>

        <p class="subtitle">
            Tecnologia · Desporto · Inovação
        </p>


        <!-- ORNAMENTO -->

        <div class="ornament">
            <span>✦</span>
        </div>


        <!-- =========================
             DESCRIÇÃO
        ========================== -->

        <p class="description">
            Entre a ciência, o desporto e a inovação,
            procuro transformar conhecimento em algo
            que possa deixar uma marca.
        </p>


        <!-- =========================
             REDES
        ========================== -->

        <div class="links">

            <!-- LINKEDIN -->

            <a
                href="https://www.linkedin.com/in/lu%C3%ADs-correia03/"
                target="_blank"
                rel="noopener noreferrer"
                class="link"
            >

                <span class="icon">
                    <i class="fa-brands fa-linkedin-in"></i>
                </span>

                LinkedIn

            </a>


            <!-- FACEBOOK -->

            <a
                href="https://www.facebook.com/eu.luiscorreia.003"
                target="_blank"
                rel="noopener noreferrer"
                class="link"
            >

                <span class="icon">
                    <i class="fa-brands fa-facebook-f"></i>
                </span>

                Facebook

            </a>


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/eu_luiscorreia_003/"
                target="_blank"
                rel="noopener noreferrer"
                class="link"
            >

                <span class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </span>

                Instagram

            </a>


            <!-- WEBSITE
                 Preparado para adicionar o link posteriormente
            -->

            <a
                href="#"
                class="link"
                onclick="return false;"
            >

                <span class="icon">
                    <i class="fa-solid fa-globe"></i>
                </span>

                Website

            </a>

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <strong>Luís Correia</strong>
            <br>

            <span>Est. · Create · Evolve</span>

        </footer>

    </main>

</body>
</html>
